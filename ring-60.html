<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ring 60</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@800&display=swap" rel="stylesheet">
<style>
/* ===== حلقة الـ60 — بدون خلفية ===== */
html,body{margin:0;background:transparent}
body{display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}

.abs60{
  --rs:min(420px,86vw);            /* ← حجم الحلقة: غيّر هذي القيمة فقط */
  --fh:"Changa","Tajawal",Tahoma,sans-serif;
  position:relative;
  width:var(--rs);
  height:var(--rs);
  flex:none;
  direction:rtl;
}
.abs60 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}

/* ظهور الشرطات واحدة واحدة */
.abs60 .sg{opacity:0;transform-box:view-box}
.abs60.go .sg{
  animation:abs60-pop .35s cubic-bezier(.2,.9,.3,1.3) forwards;
  animation-delay:calc(var(--i) * 22ms);
}
@keyframes abs60-pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

/* توهّج الشرطة الحمراء الأخيرة */
.abs60.go .sg.last{
  animation:abs60-pop .35s cubic-bezier(.2,.9,.3,1.3) forwards,
            abs60-glow 2s ease-in-out 1.6s infinite;
  animation-delay:calc(var(--i) * 22ms),1.6s;
}
@keyframes abs60-glow{50%{filter:drop-shadow(0 0 7px #ff2f3a)}}

/* النص في الوسط */
.abs60 .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.abs60 .ctr b{
  display:block;
  font:800 calc(var(--rs) * .34)/1 var(--fh);
  font-style:italic;
  background:linear-gradient(180deg,#fff,#ffb0b4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,47,58,.6));
  opacity:0;transform:scale(.7);
}
.abs60 .ctr small{
  display:block;
  font:800 calc(var(--rs) * .075) var(--fh);
  color:#ffd0d3;letter-spacing:1px;
  opacity:0;transform:translateY(8px);
}
.abs60.go .ctr b{animation:abs60-num .8s cubic-bezier(.2,.9,.3,1.2) .2s forwards}
.abs60.go .ctr small{animation:abs60-sm .6s ease 1s forwards}
@keyframes abs60-num{to{opacity:1;transform:none}}
@keyframes abs60-sm{to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .abs60 .sg,.abs60 .ctr b,.abs60 .ctr small{opacity:1!important;transform:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- ====== انسخ من هنا ====== -->
<div class="abs60" id="abs60" role="img" aria-label="60 مكتمل">
  <div class="ctr"><div><b>60</b><small>مكتمل</small></div></div>
</div>

<script>
(function(){
  var el=document.getElementById("abs60");
  var s="",i,R1=116,R2=142;
  for(i=0;i<60;i++){
    var a=(-90+i*6)*Math.PI/180,
        x1=150+Math.cos(a)*R1, y1=150+Math.sin(a)*R1,
        x2=150+Math.cos(a)*R2, y2=150+Math.sin(a)*R2,
        last=i===59, ms=[32,43,54].indexOf(i)>-1;
    s+='<line class="sg'+(last?' last':'')+'" style="--i:'+i+';transform-origin:'+x1.toFixed(1)+'px '+y1.toFixed(1)+'px"'+
       ' x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"'+
       ' stroke="'+(last?"#ff2f3a":ms?"#ffd36a":"url(#abs60-g)")+'"'+
       ' stroke-width="'+(last?7:5)+'" stroke-linecap="round"'+(last?' filter="url(#abs60-l)"':'')+'/>';
  }
  var svg='<svg viewBox="0 0 300 300" aria-hidden="true"><defs>'+
    '<linearGradient id="abs60-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffb0b4"/></linearGradient>'+
    '<filter id="abs60-l" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'+
    '<radialGradient id="abs60-a"><stop offset="0" stop-color="#ff2f3a" stop-opacity=".35"/><stop offset="1" stop-color="#ff2f3a" stop-opacity="0"/></radialGradient>'+
    '</defs>'+
    '<circle cx="150" cy="150" r="140" fill="url(#abs60-a)"/>'+
    '<circle cx="150" cy="150" r="100" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.5" stroke-dasharray="3 7"/>'+
    s+'</svg>';
  el.insertAdjacentHTML("afterbegin",svg);

  /* تشغيل الأنميشن لما يظهر في الشاشة (ويعيد التشغيل كل مرة تدخل فيها) */
  function play(){el.classList.remove("go");void el.offsetWidth;setTimeout(function(){el.classList.add("go")},150)}
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)play();else el.classList.remove("go")})},{threshold:.35}).observe(el);
  }else play();
})();
</script>
<!-- ====== لين هنا ====== -->

</body>
</html>
