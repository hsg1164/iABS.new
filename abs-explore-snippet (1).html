<!--
╔══════════════════════════════════════════════════════════════╗
║  قسم «استكشف الموقع» — iABS  (جاهز للّصق في أي صفحة)         ║
╚══════════════════════════════════════════════════════════════╝

طريقة الاستخدام:
 1) انسخ الملف كله (الأجزاء الثلاثة: CSS ثم HTML ثم JS) والصقه في المكان اللي تبيه داخل صفحتك.
 2) تأكد إن خطوط Changa و Tajawal محمّلة في الصفحة (إذا موقعك أصلاً يستخدمها ما تحتاج شي).
 3) عدّل الأقسام والروابط من الجزء الثالث (SECTIONS) فقط، ما تحتاج تلمس غيره.

ملاحظات:
 - كل شي معزول داخل .abs-explore وأسماء الكلاسات تبدأ بـ ae- فما يخرب تصميم صفحتك ولا يتخرب منها.
 - الخلفية شفافة فياخذ خلفية موقعك. ولا فيه zoom ولا ستايل على body.
 - له إطار خاص فيه: يتوسّط الصفحة وأقصى عرضه 1180px (غيّره من --ae-max في الـ CSS)،
   فما تحتاج تحطه داخل container. والتخطيط (3 فوق + 2 تحت) يتحدد بعرض الإطار نفسه،
   فيطلع نفس الشكل في أي صفحة تلصقه فيها.

⬇ مثال خط اختياري إذا موقعك ما يحمّله:
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
-->


<!-- ═══════════════ 1) CSS ═══════════════ -->
<style>
.abs-explore{
  --ae-red:#ff2f3a;--ae-bone:#ece6db;--ae-mute:#a59a96;
  --ae-fh:"Changa","Tajawal",Tahoma,sans-serif;
  --ae-f:"Tajawal",Tahoma,Arial,sans-serif;
  --ae-max:1180px;                 /* أقصى عرض للإطار — غيّره إذا تبي */
  position:relative;direction:rtl;
  box-sizing:border-box;width:100%;max-width:var(--ae-max);
  margin:64px auto;padding-inline:16px;   /* الإطار يتوسّط لوحده */
  color:var(--ae-bone);font-family:var(--ae-f);line-height:1.5;
}
/* التخطيط يتحدد بعرض الإطار نفسه (مو بعرض الشاشة) فيطلع نفس الشكل في أي صفحة */
.abs-explore .ae-box{container-type:inline-size}
.abs-explore *,.abs-explore *::before,.abs-explore *::after{box-sizing:border-box}
.abs-explore svg{display:block}
.abs-explore a{color:inherit;text-decoration:none}
.abs-explore a:focus-visible{outline:2px solid var(--ae-red);outline-offset:3px}
.abs-explore h2,.abs-explore h3,.abs-explore p{margin:0}

/* ----- ظهور تدريجي ----- */
@keyframes ae-up{from{opacity:0;transform:translateY(26px) scale(.97)}}
.abs-explore .ae-rv{opacity:0}
.abs-explore .ae-rv.in{opacity:1;animation:ae-up .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}

/* ----- رأس القسم ----- */
.abs-explore .ae-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
.abs-explore .ae-num{font:800 76px/.85 var(--ae-fh);color:transparent;-webkit-text-stroke:1.5px rgba(255,47,58,.55)}
.abs-explore .ae-tag{display:inline-block;font:800 12px var(--ae-fh);letter-spacing:2px;background:var(--ae-red);color:#fff;padding:3px 18px;border-radius:30px}
.abs-explore .ae-title{margin-top:6px;font:800 clamp(34px,6vw,54px)/1 var(--ae-fh);color:var(--ae-bone)}
.abs-explore .ae-sub{margin-top:6px;color:var(--ae-mute);font:400 16px/1.5 var(--ae-f)}
.abs-explore .ae-line{flex:1;height:2px;margin-bottom:14px;background:linear-gradient(270deg,var(--ae-red),transparent)}

/* ----- الشبكة: تتوزّع تلقائياً مهما كان عدد الأقسام ----- */
.abs-explore .ae-grid{display:grid;grid-template-columns:1fr;gap:16px}

@container (min-width:480px){                 /* إطار متوسط: عمودين */
  .abs-explore .ae-grid{grid-template-columns:repeat(2,1fr)}
  .abs-explore .ae-tile:last-child:nth-child(odd){grid-column:span 2}
}
@container (min-width:760px){                 /* إطار عادي: 3 بالصف، والصف الأخير يتمدّد (نفس الصورة) */
  .abs-explore .ae-grid{grid-template-columns:repeat(6,1fr)}
  .abs-explore .ae-tile{grid-column:span 2}
  .abs-explore .ae-tile:nth-child(3n+1):last-child{grid-column:span 6}
  .abs-explore .ae-tile:nth-child(3n+1):nth-last-child(2),
  .abs-explore .ae-tile:nth-child(3n+2):last-child{grid-column:span 3}
}

/* ----- البطاقة ----- */
.abs-explore .ae-tile{
  position:relative;display:grid;gap:12px;padding:24px;overflow:hidden;border-radius:30px;
  background:linear-gradient(160deg,rgba(30,14,14,.82),rgba(9,4,4,.92));
  box-shadow:inset 0 0 0 1.5px rgba(255,47,58,.3),0 24px 44px -28px #000;
  transition:transform .35s,box-shadow .35s;
}
.abs-explore .ae-tile:hover,.abs-explore .ae-tile.fl{
  transform:translateY(-8px);
  box-shadow:inset 0 0 0 1.5px var(--ae-red),0 30px 54px -20px rgba(255,47,58,.55);
}
.abs-explore .ae-gn{position:absolute;inset-inline-end:14px;top:-8px;font:800 110px/1 var(--ae-fh);color:transparent;-webkit-text-stroke:1.5px rgba(255,47,58,.22);pointer-events:none}
.abs-explore .ae-ti{
  width:70px;height:70px;border-radius:24px;display:grid;place-items:center;color:#ffb0b4;
  background:linear-gradient(145deg,rgba(255,47,58,.32),rgba(255,47,58,.08));
  box-shadow:inset 0 0 0 1.5px rgba(255,47,58,.55),0 12px 26px -12px var(--ae-red);
  transition:transform .35s;
}
.abs-explore .ae-tile:hover .ae-ti{transform:rotate(-8deg) scale(1.08)}
.abs-explore .ae-ti svg{width:38px;height:38px}
.abs-explore .ae-name{margin-top:6px;font:800 28px/1.2 var(--ae-fh);color:var(--ae-bone)}
.abs-explore .ae-desc{color:var(--ae-mute);font:400 14.5px/1.6 var(--ae-f)}
.abs-explore .ae-go{display:flex;align-items:center;gap:10px;margin-top:6px;font:800 14px var(--ae-fh);color:var(--ae-red)}
.abs-explore .ae-arrow{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px rgba(255,47,58,.5);transition:transform .3s,background .3s,color .3s;
}
.abs-explore .ae-arrow svg{width:18px;height:18px}
.abs-explore .ae-tile:hover .ae-arrow{transform:translateX(-8px);background:var(--ae-red);color:#080404}
.abs-explore .ae-sw{
  position:absolute;inset:0;pointer-events:none;transform:translateX(120%);transition:transform .8s;
  background:linear-gradient(100deg,transparent 35%,rgba(255,47,58,.18),transparent 65%);
}
.abs-explore .ae-tile:hover .ae-sw{transform:translateX(-120%)}

/* ----- رسالة صغيرة (تظهر إذا القسم بدون رابط) ----- */
.abs-explore .ae-toast{
  position:fixed;inset-inline:0;bottom:24px;margin:auto;width:max-content;max-width:90%;z-index:99;
  padding:11px 24px;border-radius:30px;background:var(--ae-red);color:#fff;font:800 14px var(--ae-fh);
  box-shadow:0 14px 30px -10px var(--ae-red);opacity:0;pointer-events:none;transition:opacity .25s;
}
.abs-explore .ae-toast.on{opacity:1}

@container (max-width:560px){.abs-explore .ae-num{font-size:52px}}
@media(prefers-reduced-motion:reduce){
  .abs-explore *{animation:none!important;transition:none!important}
  .abs-explore .ae-rv{opacity:1}
}
</style>


<!-- ═══════════════ 2) HTML ═══════════════ -->
<section class="abs-explore" id="abs-explore" dir="rtl" aria-labelledby="ae-h">
 <div class="ae-box">
  <div class="ae-head ae-rv">
    <span class="ae-num">00</span>
    <div>
      <span class="ae-tag">EXPLORE</span>
      <h2 class="ae-title" id="ae-h">استكشف الموقع</h2>
      <p class="ae-sub">كل أقسام iABS في مكان واحد.</p>
    </div>
    <span class="ae-line"></span>
  </div>

  <!-- البطاقات تنبني تلقائياً من SECTIONS في الجزء 3 -->
  <div class="ae-grid"></div>
 </div>

 <div class="ae-toast" role="status" aria-live="polite"></div>
</section>


<!-- ═══════════════ 3) JS ═══════════════ -->
<script>
(function(){
  /* ╔════════════════════════════════════════════╗
     ║  الشي الوحيد اللي تعدّله: الأقسام والروابط   ║
     ╚════════════════════════════════════════════╝
     title : اسم القسم
     desc  : الوصف تحت الاسم
     url   : رابط القسم  (مثال: "abs-social.html" أو "https://kick.com/iabs")
             - رابط يبدأ بـ http يفتح في تبويب جديد، وغير كذا يفتح في نفس التبويب
             - إذا تركته "" تظهر رسالة تذكيرية بدل ما يفتح شي
     icon  : share | stream | heart | calendar | archive | star
     لإضافة قسم جديد انسخ سطر كامل وغيّر القيم. الشبكة تتوزّع لوحدها. */
  var SECTIONS=[
    {title:"التواصل", desc:"كل المنصات والحسابات الرسمية في مكان واحد.",  url:"", icon:"share"},
    {title:"البث",    desc:"شاهد البث المباشر وتفاعل مع المجتمع.",         url:"", icon:"stream"},
    {title:"الدعم",   desc:"ادعم القناة عبر Streamlabs أو Creators.",       url:"", icon:"heart"},
    {title:"الجدول",  desc:"مواعيد البثوث والفعاليات القادمة.",             url:"", icon:"calendar"},
    {title:"الأرشيف", desc:"كل البثوث السابقة واللقطات وتقارير الجلسات.",   url:"", icon:"archive"}
  ];
  var OPEN_TEXT="افتح";
  var EMPTY_MSG="ضع رابط القسم في SECTIONS";

  /* ───────── من هنا ما تحتاج تعدّل ───────── */
  var ICONS={
    share:'<circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="6" r="2.8"/><circle cx="18" cy="18" r="2.8"/><path d="m8.5 10.8 7-3.5M8.5 13.2l7 3.5"/>',
    stream:'<rect x="3" y="5" width="18" height="12" rx="3"/><path d="m10.5 8.5 4 2.5-4 2.5zM8 21h8M12 17v4"/>',
    heart:'<path d="M12 20s-7-4.5-9-9.2C1.8 7 4.2 4 7.3 4c1.9 0 3.5 1 4.7 2.8C13.2 5 14.8 4 16.7 4 19.8 4 22.2 7 21 10.8 19 15.5 12 20 12 20z"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 14v3l2 1"/>',
    archive:'<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',
    star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
  };
  var ARROW='<path d="M19 12H5M11 6l-6 6 6 6"/>';

  var root=document.getElementById("abs-explore");
  if(!root)return;
  var grid=root.querySelector(".ae-grid"),toastEl=root.querySelector(".ae-toast"),tt;

  function svg(inner,w){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+w+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>'}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("on")},2000)}

  SECTIONS.forEach(function(s,i){
    var a=document.createElement("a");
    a.className="ae-tile ae-rv";
    a.style.setProperty("--d",(i*.07).toFixed(2)+"s");
    a.href=s.url||"#";
    if(/^https?:\/\//i.test(s.url||"")){a.target="_blank";a.rel="noopener"}
    a.innerHTML=
      '<span class="ae-sw"></span>'+
      '<span class="ae-gn">'+(i<9?"0":"")+(i+1)+'</span>'+
      '<div class="ae-ti">'+svg(ICONS[s.icon]||ICONS.star,1.8)+'</div>'+
      '<h3 class="ae-name">'+esc(s.title)+'</h3>'+
      '<p class="ae-desc">'+esc(s.desc)+'</p>'+
      '<div class="ae-go">'+esc(OPEN_TEXT)+'<span class="ae-arrow">'+svg(ARROW,2.6)+'</span></div>';
    if(!s.url){
      a.addEventListener("click",function(e){
        e.preventDefault();
        a.classList.add("fl");setTimeout(function(){a.classList.remove("fl")},1600);
        toast(EMPTY_MSG);
      });
    }
    grid.appendChild(a);
  });

  /* ظهور تدريجي عند التمرير */
  var items=root.querySelectorAll(".ae-rv");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}});
    },{threshold:.12});
    items.forEach(function(el){io.observe(el)});
  }else{
    items.forEach(function(el){el.classList.add("in")});
  }
})();
</script>
