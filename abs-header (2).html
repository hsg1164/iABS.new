<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iABS — Header</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2f3a;--red2:#c0161f;--hot:#ffb0b4;--bone:#ece6db;--mute:#a59a96;--green:#3dff7a;--f:"Tajawal",Tahoma,sans-serif;--fh:"Changa","Tajawal",sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:#000;color:var(--bone);font-family:var(--f);min-height:100vh;overflow-x:hidden}
button,a{font-family:inherit;color:inherit;text-decoration:none}
button{background:none;border:0;cursor:pointer}
svg{display:block}

/* ===== HEADER ===== */
.hd{position:sticky;top:12px;z-index:60;margin:20px auto 0;max-width:1240px;width:calc(100% - 24px);height:76px;transition:height .5s var(--ease),top .5s var(--ease);
  --glow:rgba(255,47,58,.35);filter:drop-shadow(0 14px 30px rgba(255,47,58,.12))}
.hd.sc{height:60px;top:8px}
.hd.open{height:auto}
.bg{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(255,47,58,.10),transparent 55%),
  repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.022) 22px 23px),
  linear-gradient(135deg,#150708,#070303 60%,#0f0505);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .4s}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,80,90,.22) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 1.4s .9s var(--ease) forwards}
.hd.gl .bg::after{animation:sweep .6s var(--ease)}
@keyframes sweep{to{transform:translateX(120%)}}
.fr{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fr path,.fr line,.fr rect{fill:none;vector-effect:non-scaling-stroke}
.f-base{stroke:rgba(255,47,58,.55);stroke-width:1.5;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.3s .1s var(--ease) forwards}
.f-in{stroke:rgba(255,47,58,.16);stroke-width:1}
.f-run{stroke:url(#gr);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:70 930;filter:url(#gl);animation:run 5s linear infinite}
.f-run.b{stroke-dasharray:36 964;animation-duration:7.5s;animation-direction:reverse;opacity:.7}
.hd.fast .f-run{animation-duration:1.2s}
.f-tick{stroke:rgba(255,47,58,.45);stroke-width:3;stroke-dasharray:1 7}
.f-br{stroke:var(--red);stroke-width:2;stroke-linecap:square}
.f-pg{stroke:var(--hot);stroke-width:2.4;filter:url(#gl)}
.nd{fill:var(--red)!important;animation:blink 2s infinite}
.nd:nth-of-type(2n){animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes run{to{stroke-dashoffset:-1000}}
@keyframes blink{50%{opacity:.25}}
.hd.gl .fr{animation:glitch .38s steps(2) 1}
@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(-3px,1px);filter:hue-rotate(-20deg)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0);filter:hue-rotate(20deg)}100%{transform:none}}

.in{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;height:76px;padding:0 26px;transition:height .5s var(--ease)}
.hd.sc .in{height:60px}
.in>*{opacity:0;transform:translateY(-10px);animation:pop .6s var(--ease) forwards}
.in>:nth-child(1){animation-delay:.75s}.in>:nth-child(2){animation-delay:.9s}.in>:nth-child(3){animation-delay:1.05s}
@keyframes pop{to{opacity:1;transform:none}}

.brand{display:flex;align-items:center;gap:12px}
.bl{position:relative;width:48px;height:48px;border-radius:50%;transition:.5s var(--ease)}
.hd.sc .bl{width:38px;height:38px}
.bl img{width:100%;height:100%;border-radius:50%;position:relative;z-index:1}
.bl::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--red);border-bottom-color:var(--red);animation:spin 4s linear infinite}
.bl::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px dashed rgba(255,47,58,.4);animation:spin 12s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bl i{position:absolute;z-index:2;bottom:0;inset-inline-start:0;width:10px;height:10px;border-radius:50%;background:#666;border:2px solid #0a0404}
.bl i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.bt b{display:block;font:800 22px/1 var(--fh);letter-spacing:.5px}
.bt b em{font-style:normal;color:var(--red);text-shadow:0 0 14px rgba(255,47,58,.7)}
.bt small{font-size:11px;color:var(--mute);letter-spacing:.6px;transition:.4s}
.hd.sc .bt small{opacity:0;height:0;display:block}

.links{position:relative;display:flex;justify-content:center;gap:4px}
.links a{position:relative;display:flex;align-items:center;gap:8px;padding:10px 16px;font-weight:700;font-size:14px;color:#cfc6c2;transition:color .3s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.links a svg{width:17px;height:17px;transition:transform .4s var(--ease)}
.links a:hover{color:#fff}.links a:hover svg{transform:translateY(-2px) scale(1.15);color:var(--red)}
.links a.act{color:#fff}
.ind{position:absolute;top:50%;height:40px;margin-top:-20px;left:0;width:0;opacity:0;background:linear-gradient(180deg,rgba(255,47,58,.28),rgba(255,47,58,.06));border-bottom:2px solid var(--red);box-shadow:0 8px 20px -8px var(--red);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:left .5s var(--ease),width .5s var(--ease),opacity .3s}

.tl{display:flex;align-items:center;gap:10px}
.st{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.st i{width:7px;height:7px;border-radius:50%;background:#777}
.ar{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 12px;background:rgba(255,255,255,.05);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background .3s}
.ar:hover{background:rgba(255,47,58,.18)}
.rg{position:relative;width:30px;height:30px;display:grid;place-items:center}
.rg>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:2.6}.rg .t{stroke:rgba(255,255,255,.12)}
.rg .p{stroke:var(--red);stroke-dasharray:75.4;stroke-dashoffset:75.4;stroke-linecap:round;animation:ring 1.6s 1.3s var(--ease) forwards;filter:drop-shadow(0 0 4px var(--red))}
@keyframes ring{to{stroke-dashoffset:0}}
.rg i svg{width:13px;height:13px;color:var(--red)}
.ar small{display:block;font-size:10px;color:var(--mute);line-height:1}.ar b{font:800 13px/1.2 var(--fh)}
.nb,.lang{height:38px;min-width:38px;display:grid;place-items:center;background:rgba(255,255,255,.05);transition:.3s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.nb:hover{background:rgba(255,47,58,.2)}.nb svg{width:18px;height:18px}
.nb.spin svg{animation:spin .7s var(--ease)}
.lang{padding:0 16px;font:800 13px var(--fh);background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 0 22px -4px var(--red)}
.lang:hover{filter:brightness(1.2)}
.burger{display:none}
html[dir=ltr] .fr,html[dir=ltr] .bg{transform:scaleX(-1)}
.burger path{transition:.4s var(--ease);transform-origin:center}
.hd.open .burger path:nth-child(1){transform:translateY(5px) rotate(45deg)}
.hd.open .burger path:nth-child(2){opacity:0}
.hd.open .burger path:nth-child(3){transform:translateY(-5px) rotate(-45deg) scaleX(1.4)}

.drawer{position:relative;z-index:2;display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.hd.open .drawer{grid-template-rows:1fr}
.drawer>div{overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px}
.hd.open .drawer>div{padding:6px 18px 22px}
.drawer a{display:flex;align-items:center;gap:10px;padding:14px;font-weight:700;background:rgba(255,255,255,.05);border-inline-start:2px solid var(--red);opacity:0;transform:translateX(24px);transition:.45s var(--ease)}
.drawer a svg{width:18px;height:18px;color:var(--red)}
.hd.open .drawer a{opacity:1;transform:none}
.hd.open .drawer a:nth-child(1){transition-delay:.1s}.hd.open .drawer a:nth-child(2){transition-delay:.16s}.hd.open .drawer a:nth-child(3){transition-delay:.22s}.hd.open .drawer a:nth-child(4){transition-delay:.28s}.hd.open .drawer a:nth-child(5){transition-delay:.34s;grid-column:span 2}

@media(max-width:900px){
  .links,.st,.ar{display:none}.burger{display:grid}
  .hd,.in{height:64px}.hd.sc,.hd.sc .in{height:54px}.in{padding:0 16px;gap:10px}
  .in{grid-template-columns:1fr auto}.in>:nth-child(2){display:none}
  .bt small{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}

/* demo sections to test scroll */
.sec{min-height:100vh;display:grid;place-items:center;font:800 clamp(40px,8vw,110px) var(--fh);color:#120808;border-top:1px solid #140a0a}
</style>
</head>
<body>

<header class="hd" id="hd">
  <div class="bg" id="bg"></div>
  <svg class="fr" id="fr" aria-hidden="true">
    <defs>
      <linearGradient id="gr"><stop offset="0" stop-color="#ff2f3a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd0d3"/><stop offset="1" stop-color="#ff2f3a" stop-opacity="0"/></linearGradient>
      <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path class="f-in" id="p-in"/>
    <path class="f-base" id="p-base" pathLength="1000"/>
    <path class="f-run" id="p-run" pathLength="1000"/>
    <path class="f-run b" id="p-run2" pathLength="1000"/>
    <path class="f-tick" id="p-tick"/>
    <path class="f-br" id="p-br"/>
    <line class="f-pg" id="p-pg"/>
    <g id="nodes"></g>
  </svg>

<script>
(()=>{
const $=id=>document.getElementById(id),hd=$('hd'),NS='http://www.w3.org/2000/svg';
let prog=0;

/* ---- رسم الإطار: مضلع بقصّات + جيب تحت الشعار + عقد ---- */
function pts(w,h,c,s){
  const p=[[c,0],[w-s,0],[w,s],[w,h-c],[w-c,h]];
  if(w>900&&!hd.classList.contains('open')) p.push([w-150,h],[w-164,h-8],[w-300,h-8],[w-314,h]);
  p.push([s,h],[0,h-s],[0,c]);
  return p;
}
const d=a=>'M'+a.map(q=>q.join(' ')).join('L')+'Z';
function draw(){
  const w=hd.offsetWidth,h=hd.offsetHeight,sc=hd.classList.contains('sc'),mob=w<900;
  const c=mob?16:(sc?20:30),s=mob?7:(sc?8:11);
  const a=pts(w,h,c,s),i=pts(w-12,h-12,c,s).map(q=>[q[0]+6,q[1]+6]);
  $('p-base').setAttribute('d',d(a));$('p-run').setAttribute('d',d(a));$('p-run2').setAttribute('d',d(a));
  $('p-in').setAttribute('d',d(i));
  $('bg').style.clipPath='polygon('+a.map(q=>q[0]+'px '+q[1]+'px').join(',')+')';
  /* علامات القياس على الحافة العلوية + أقواس الزوايا */
  $('p-tick').setAttribute('d',`M${c+14} 6H${w*.55}M${w*.62} ${h-5}H${w*.8}`);
  const k=mob?10:16;
  $('p-br').setAttribute('d',`M${c+2} 12V${c+2}H${c+12}M${w-s-12} ${h-4}H${w-s-2}V${h-12}`.replace(/[A-Za-z]/g,m=>m));
  /* عقد متوهجة على رؤوس القصّات */
  const n=$('nodes');n.innerHTML='';
  [[c,0],[w,s],[w-c,h],[0,h-s]].forEach(([x,y])=>{const r=document.createElementNS(NS,'rect');r.setAttribute('x',x-3);r.setAttribute('y',y-3);r.setAttribute('width',6);r.setAttribute('height',6);r.setAttribute('class','nd');r.setAttribute('transform',`rotate(45 ${x} ${y})`);n.appendChild(r)});
  /* شريط تقدّم التمرير على الحافة السفلية (من اليمين) */
  const pg=$('p-pg'),y=h-1,x0=w-c,len=Math.max(0,(w-2*c)*prog);
  pg.setAttribute('x1',x0);pg.setAttribute('x2',x0-len);pg.setAttribute('y1',y);pg.setAttribute('y2',y);
  pg.style.opacity=prog>0.003?1:0;
  moveInd();
}
new ResizeObserver(draw).observe(hd);

/* ---- التمرير: تصغير + غلتش + سرعة الإضاءة + تقدّم + تتبّع القسم ---- */
let last=scrollY,tm,gt,ticking=false;
function onScroll(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  prog=max>0?y/max:0;
  const was=hd.classList.contains('sc'),now=y>40;
  hd.classList.toggle('sc',now);
  if(was!==now){hd.classList.add('gl');clearTimeout(gt);gt=setTimeout(()=>hd.classList.remove('gl'),420)}
  if(Math.abs(y-last)>40){hd.classList.add('fast');clearTimeout(tm);tm=setTimeout(()=>hd.classList.remove('fast'),400)}
  last=y;
  let cur='';document.querySelectorAll('.sec').forEach(s=>{if(s.getBoundingClientRect().top<innerHeight*.4)cur=s.id});
  document.querySelectorAll('#links a').forEach(a=>a.classList.toggle('act',a.dataset.s===cur));
  moveInd();draw();
}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;onScroll()})}},{passive:true});

function moveInd(){
  const a=document.querySelector('#links a.act'),i=$('ind');
  if(!a||innerWidth<=900){i.style.opacity=0;return}
  i.style.opacity=1;i.style.left=a.offsetLeft+'px';i.style.width=a.offsetWidth+'px';
}

/* ---- قائمة الجوال ---- */
const dr=$('dr');
dr.innerHTML=[...document.querySelectorAll('#links a')].map(a=>a.outerHTML).join('');
$('bgr').onclick=()=>{hd.classList.toggle('open');hd.classList.add('gl');setTimeout(()=>hd.classList.remove('gl'),420)};
dr.addEventListener('click',()=>hd.classList.remove('open'));

/* ---- تحديث + لغة ---- */
$('rf').onclick=e=>{const b=e.currentTarget;b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin')};
const T={ar:{hub:'مركز بث iABS',social:'التواصل',stream:'البث',support:'الدعم',sched:'الجدول',arch:'الأرشيف',arch2:'أرشيف',off:'غير متصل حاليا'},
         en:{hub:'iABS stream hub',social:'Social',stream:'Stream',support:'Support',sched:'Schedule',arch:'Archive',arch2:'Archive',off:'Offline'}};
$('lang').onclick=e=>{
  const en=document.documentElement.lang==='ar';
  document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
  e.currentTarget.textContent=en?'AR':'EN';
  document.querySelectorAll('[data-i]').forEach(n=>n.textContent=T[en?'en':'ar'][n.dataset.i]);
  hd.classList.add('gl');setTimeout(()=>{hd.classList.remove('gl');draw()},420);
};
document.fonts&&document.fonts.ready.then(draw);
draw();onScroll();
})();
</script>
</body>
</html>
