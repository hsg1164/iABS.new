*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);font-family:var(--f);line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(6,2,2,.5),rgba(6,2,2,.78)),var(--pcbg) center/cover no-repeat}
@media(max-width:700px){body::before{background:linear-gradient(rgba(6,2,2,.45),rgba(6,2,2,.75)),var(--mobbg) center/cover no-repeat}}
button,a{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:30px 16px 80px;display:grid;gap:26px}
.cut{--c:18px;--bc:rgba(255,47,58,.5);position:relative;isolation:isolate;background:var(--bc);clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.cut::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:var(--fill,linear-gradient(180deg,rgba(22,10,10,.9),rgba(9,4,4,.93)));clip-path:polygon(calc(var(--c) - 1px) 0,100% 0,100% calc(100% - var(--c) + 1px),calc(100% - var(--c) + 1px) 100%,0 100%,0 calc(var(--c) - 1px))}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
svg{display:block}
[data-n],.sm b{direction:ltr;unicode-bidi:isolate;display:inline-block}
.btn{--c:12px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 26px;border:0;cursor:pointer;font:800 17px var(--fh);color:#fff;text-decoration:none;background:var(--bg,linear-gradient(180deg,#ff4b53,#c0161f));clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));transition:filter .2s,transform .15s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4),transparent 65%);transform:translateX(120%);animation:sh 3.4s infinite}
@keyframes sh{0%,55%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
.btn svg{width:20px;height:20px}
.btn.yt{--bg:linear-gradient(180deg,#ff4a4a,#c4101a)}.btn.dc{--bg:linear-gradient(180deg,#7a86ff,#4752d8)}.btn.kk{--bg:linear-gradient(180deg,#7dff4a,#2fb80a);color:#06130a}

/* section head */
.sh{display:flex;align-items:flex-end;gap:16px;margin-top:20px}
.sh .num{font:800 76px/.85 var(--fh);color:transparent;-webkit-text-stroke:1.5px rgba(255,47,58,.55)}
.sh .tx{display:grid;gap:6px}
.sh .tag{justify-self:start;font:800 12px var(--fh);letter-spacing:2px;background:var(--red);color:#fff;padding:3px 16px 3px 22px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.sh h2{margin:0;font:800 clamp(36px,6.5vw,58px)/1 var(--fh);letter-spacing:1px}
.sh p{margin:0;color:var(--mute)}
.sh .ln{flex:1;height:2px;background:linear-gradient(270deg,var(--red),transparent);margin-bottom:14px}

/* stats + share */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sm{--c:14px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.sm b{font:800 38px/1 var(--fh);color:var(--red);white-space:nowrap}
.sm span{color:var(--mute);font-size:13px;line-height:1.3}
.share{--c:16px;padding:16px 20px;display:grid;gap:12px}
.share h4{margin:0;font:800 15px var(--fh);display:flex;justify-content:space-between;color:var(--bone)}
.share h4 small{font:400 13px var(--f);color:var(--mute)}
.sb{display:flex;height:16px;gap:3px}
.sb i{display:block;height:100%;width:0;background:var(--pc);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);transition:width 1.2s cubic-bezier(.2,.7,.2,1),filter .2s,transform .2s;cursor:pointer}
.sb i:hover,.sb i.hl{filter:brightness(1.4);transform:scaleY(1.5)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mute)}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg span::before{content:"";width:9px;height:9px;background:var(--pc);transform:rotate(45deg)}
.lg b{color:var(--bone)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button,.srt button{border:0;cursor:pointer;font:800 13px var(--fh);color:var(--bone);background:rgba(255,255,255,.08);padding:8px 20px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:background .2s}
.chips button:hover,.srt button:hover{background:rgba(255,47,58,.4)}
.chips button[aria-pressed=true],.srt button[aria-pressed=true]{background:var(--red);color:#fff}
.srt{display:flex;gap:6px;margin-inline-start:auto;align-items:center;color:var(--mute);font-size:13px}

/* arena */
.arena{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pl{overflow:hidden;--c:18px;--bc:color-mix(in srgb,var(--pc) 42%,transparent);--fill:linear-gradient(135deg,color-mix(in srgb,var(--pc) 17%,#0b0606),#090505 68%);position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:20px;min-height:136px;text-decoration:none;color:inherit;cursor:pointer;transition:transform .3s,opacity .3s}
.pl:hover,.pl.hl{--bc:var(--pc);transform:translateY(-5px)}
.pl.off{display:none}
.pl .ghost{position:absolute;inset-inline-end:-18px;bottom:-26px;width:150px;height:150px;color:var(--pc);opacity:.08;pointer-events:none;transition:opacity .3s,transform .4s}
.pl:hover .ghost{opacity:.16;transform:rotate(-8deg) scale(1.1)}
.pl .sw{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,color-mix(in srgb,var(--pc) 25%,transparent),transparent 65%);transform:translateX(120%);transition:transform .8s;pointer-events:none}
.pl:hover .sw{transform:translateX(-120%)}
.ic{width:66px;height:66px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 20%,#0a0505);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--pc) 55%,transparent);color:var(--pc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:transform .3s}
.pl:hover .ic{transform:rotate(60deg) scale(1.06)}.pl:hover .ic svg{transform:rotate(-60deg)}
.ic svg{width:30px;height:30px;transition:transform .3s}
.bd{min-width:0;display:grid;gap:3px}
.bd .k{font:800 11px var(--fh);letter-spacing:2.5px;color:var(--pc)}
.bd .h{font:800 24px/1.15 var(--fh);word-break:break-all}
.bd .d{font-size:13px;color:var(--mute)}
.bd .m{display:flex;align-items:center;gap:8px;font:800 14px var(--fh);color:var(--bone);margin-top:4px}
.bd .m svg{width:14px;height:14px;color:var(--pc)}
.bd .m em{font-style:normal;color:var(--mute);font:400 12px var(--f)}
.go{width:46px;height:46px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pc) 50%,transparent);display:grid;place-items:center;color:var(--pc);transition:transform .3s,background .3s,color .3s}
.go svg{width:20px;height:20px}
.pl:hover .go{transform:translateX(-8px);background:var(--pc);color:#080404}
.cp{position:absolute;top:10px;inset-inline-start:14px;border:0;cursor:pointer;font:800 11px var(--fh);color:#080404;background:var(--pc);padding:2px 12px;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);opacity:0;transform:translateY(-4px);transition:.25s}
.pl:hover .cp,.cp:focus-visible{opacity:1;transform:none}
.pl.hero{grid-column:span 2;--c:26px;min-height:190px;gap:22px;padding:26px}
.pl.hero .ic{width:92px;height:92px}.pl.hero .ic svg{width:44px;height:44px}
.pl.hero .h{font-size:46px}.pl.hero .d{font-size:15px}
.pl.hero .m{font-size:22px;margin-top:8px}.pl.hero .m svg{width:20px;height:20px}
.pl.hero .ghost{width:260px;height:260px;opacity:.1}
.stage{display:inline-flex;align-items:center;gap:8px;font:800 11px var(--fh);letter-spacing:1px;color:var(--pc);border:1px solid var(--pc);padding:2px 12px;justify-self:start}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc);animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px;margin-inline-start:6px}
.eq i{width:4px;background:var(--pc);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}.eq i:nth-child(5){animation-delay:.3s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
.pl.hero .top{display:flex;align-items:center}

/* HQ */
.hq{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.hc{display:flex;flex-direction:column;--c:26px;--bc:color-mix(in srgb,var(--pc) 55%,transparent);--fill:linear-gradient(180deg,color-mix(in srgb,var(--pc) 14%,#0b0606),#080404 55%);padding:24px;display:grid;gap:16px;align-content:start}
.hh{display:flex;align-items:center;gap:14px}
.hc .btn{margin-top:auto}
.hh .ic{width:62px;height:62px}.hh .ic svg{width:28px;height:28px}
.hh h3{margin:0;font:800 24px var(--fh);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hh p{margin:2px 0 0;color:var(--mute);font-size:13px}
.pillb{font:800 10.5px var(--fh);letter-spacing:1px;color:var(--pc);border:1px solid var(--pc);padding:1px 10px}
.stat{margin-inline-start:auto;text-align:end}
.stat b{display:block;font:800 32px/1 var(--fh)}

function layout(){
 document.querySelectorAll(".pl").forEach(function(el){var p=PL.filter(function(x){return x.id===el.dataset.id})[0];
  el.classList.toggle("off",cat!=="all"&&el.dataset.cat!==cat);

document.addEventListener("mouseout",function(e){if(e.target.closest("[data-p],[data-id]"))document.querySelectorAll(".hl").forEach(function(x){x.classList.remove("hl")})});

var AV=["#ff6b6b","#ffd23f","#6bd6ff","#b58cff","#7dffb0","#ffa24a"],AN=["Z","K","N","R","S","M"];
var SP=[40,34,26,20,16,14,18,25,33,40,48,55,60,66,72,80,88,96,100,94,86,74,60,50];
function spark(){var w=100,h=30,m=Math.max.apply(null,SP),pts=SP.map(function(v,i){return (i/(SP.length-1)*w).toFixed(1)+","+(h-4-(v/m)*(h-8)).toFixed(1)});
 return '<svg viewBox="0 0 100 30" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b78ff" stop-opacity=".5"/><stop offset="1" stop-color="#6b78ff" stop-opacity="0"/></linearGradient></defs><polygon points="0,30 '+pts.join(" ")+' 100,30" fill="url(#sg)"/><polyline class="l" points="'+pts.join(" ")+'" fill="none" stroke="#9aa3ff" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>'}
function ytMain(i){var v=VID[i];return '<button class="vid cut" data-vm="'+i+'" style="--pc:#ff2a2a;--vh:'+v.h+'"><span class="bg"></span><img class="wm" src="'+LOGO+'" alt=""><span class="play">'+svg("play")+'</span>'+(i===0?'<span class="new"><i></i>الأحدث</span>':'')+'<span class="tt">'+v.t+'</span></button><div class="vm"><span>'+svg("cal")+v.d+'</span><span>'+(i===0?"آخر فيديو منشور":"فيديو سابق")+'</span></div>'}
function cta(o,ic,t,sub,c,k){return '<span class="ctaw" style="--pc:'+c+'"><a class="cta" href="#" data-o="'+o+'"><span class="fl"></span><span class="ci">'+svg(ic)+'</span><span class="ct"><b>'+t+'</b><small>'+sub+'</small></span><span class="ca">'+svg("arr")+'</span></a></span>'}
$("hq").innerHTML=
 '<article class="hc cut rv" style="--pc:#6b78ff;--d:0s"><div class="hh"><div class="ic">'+svg("dc")+'</div><div><h3>ABS COMMUNITY <span class="pillb">ELITE</span></h3><p>أكبر تجمع للأساطير</p></div><div class="stat"><b data-n="2363">0</b><span><i></i>متصل الآن</span></div></div>'+
 '<div class="bn cut" style="--pc:#6b78ff"><span class="bg"></span><div class="rg"><i class="halo"></i><i class="orb"></i><img src="'+LOGO+'" alt=""></div><span class="live"><i></i>سيرفر نشط</span><span class="nm">ABS COMMUNITY</span></div>'+
 '<div class="np cut"><div class="t"><small><i></i>يلعب الآن</small><b>a7m · EA SPORTS FC 27</b></div><div class="stack">'+AN.map(function(a,i){return '<i style="--a:'+AV[i]+'" title="'+a+'">'+a+'</i>'}).join("")+'<i class="more">+235</i></div></div>'+
 '<div class="act cut"><h5>نشاط السيرفر خلال 24 ساعة<small>تجريبي</small></h5>'+spark()+'</div>'+
 cta("Discord","dc","انضم للفرقة الآن","2,363 عضو متصل الآن","#6b78ff")+'</article>'+
 '<article class="hc cut rv" style="--pc:#ff2a2a;--d:.1s"><div class="hh"><div class="ic">'+svg("yt")+'</div><div><h3>قناة iABS <span class="pillb">YT</span></h3><p>أرشيف البثوث وأجمل اللقطات</p></div><div class="stat"><b data-n="110.1" data-d="1" data-s="K+">0</b><span>مشترك</span></div></div>'+
 '<div id="ytm" style="display:grid;gap:12px">'+ytMain(0)+'</div>'+
 '<div class="vl" id="vl">'+VID.map(function(v,i){return '<button class="cut'+(i===0?" on":"")+'" data-v="'+i+'" style="--pc:#ff2a2a;--vh:'+v.h+'"><span class="bg"></span><span>'+v.t+'</span></button>'}).join("")+'</div>'+

document.addEventListener("click",function(e){
 var cp=e.target.closest("[data-cp]");if(cp){e.preventDefault();e.stopPropagation();try{navigator.clipboard.writeText(cp.dataset.cp).then(function(){toast("تم نسخ "+cp.dataset.cp);cp.innerHTML=svg("chk");setTimeout(function(){cp.innerHTML=svg("cpy")},1300)},function(){toast("تعذّر النسخ")})}catch(_){toast("تعذّر النسخ")}return}
 var v=e.target.closest("[data-v]");if(v){var i=+v.dataset.v;$("ytm").innerHTML=ytMain(i);document.querySelectorAll("#vl button").forEach(function(b){b.classList.toggle("on",b===v)});return}

/* ===== KICK LIVE HOOK =====
   لما يبدأ البث:  setKick({live:true, title:"عنوان البث", viewers:1234})
   لما يوقف:       setKick({live:false})
   مثال جلب الحالة كل 30 ثانية (عدّل الرابط حسب API عندك):
   // setInterval(function(){fetch("/api/kick-status").then(function(r){return r.json()}).then(setKick)},30000);
   للمعاينة: افتح الصفحة بـ ?kick=live */
function tick(el,a,z){var t0=null;(function s(t){t0=t0||t;var p=Math.min(1,(t-t0)/900),v=a+(z-a)*(1-Math.pow(1-p,3));el.textContent=Math.round(v).toLocaleString("en");if(p<1)requestAnimationFrame(s)})(performance.now())}
function setKick(s){var el=$("kick");if(!el)return;s=s||{};var on=!!s.live;el.classList.toggle("is-live",on);el.classList.toggle("is-off",!on);
 if(on){$("kkT").textContent=s.title||"بث مباشر الآن";var b=$("kkV"),to=+s.viewers||0,from=+(b.dataset.v||0);b.dataset.v=to;tick(b,from,to)}}
window.setKick=setKick;
setKick(new URLSearchParams(location.search).get("kick")!=="off"?{live:true,title:"تحدي الأساطير الكبير – نلعب مع المتابعين!",viewers:1284}:{live:false});

/* reveal + count-up */
function cu(el){var n=+el.dataset.n,d=+(el.dataset.d||0),sf=el.dataset.s||"",t0=null;function s(t){t0=t0||t;var p=Math.min(1,(t-t0)/1500),v=n*(1-Math.pow(1-p,3));el.textContent=(d?v.toFixed(d):Math.round(v).toLocaleString("en"))+sf;if(p<1)requestAnimationFrame(s)}requestAnimationFrame(s)}
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var el=en.target;el.classList.add("in");if(el.dataset.n)cu(el);el.querySelectorAll("[data-n]").forEach(cu);el.querySelectorAll("[data-w]").forEach(function(b){b.style.width=b.dataset.w+"%"});io.unobserve(el)})},{threshold:.12});
document.querySelectorAll(".rv").forEach(function(e){io.observe(e)});
</script>
