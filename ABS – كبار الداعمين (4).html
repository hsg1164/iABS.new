*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);font-family:var(--f);line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(rgba(6,2,2,.45),rgba(6,2,2,.7)),var(--pcbg) center/cover no-repeat}
@media(max-width:700px){body::before{background:linear-gradient(rgba(6,2,2,.4),rgba(6,2,2,.65)),var(--mobbg) center/cover no-repeat}}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 70px;display:grid;gap:34px}
/* cut-corner panels */
.cut{--c:18px;--bc:rgba(255,47,58,.55);position:relative;isolation:isolate;background:var(--bc);clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c))}
.cut::before{content:"";position:absolute;inset:1.5px;z-index:-1;background:linear-gradient(180deg,rgba(22,10,10,.9),rgba(9,4,4,.92));clip-path:polygon(calc(var(--c) - 1px) 0,100% 0,100% calc(100% - var(--c) + 1px),calc(100% - var(--c) + 1px) 100%,0 100%,0 calc(var(--c) - 1px))}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.btn{--c:12px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 28px;border:0;cursor:pointer;font:800 16px var(--fh);color:#fff;background:linear-gradient(180deg,#ff4b53,#c0161f);clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));text-decoration:none;transition:filter .2s,transform .15s;letter-spacing:.3px}
.btn:hover{filter:brightness(1.18);transform:translateY(-2px)}
.btn.g{background:rgba(255,255,255,.08);color:var(--bone);box-shadow:inset 0 0 0 1px rgba(236,230,219,.3)}
.btn svg{width:18px;height:18px}

/* brand bar */
.bar{display:flex;align-items:center;gap:14px}
.bar img{width:48px;height:48px;border-radius:50%}
.bar b{font:800 26px var(--fh);letter-spacing:2px}

/* special alert */
var AMT=[50,100,200,300,400,500,1000],amt=100;

function play(){var al=$("al"),i=AMT.indexOf(amt),du=5+i*4;
 $("an").innerHTML='<em></em>';$("an").firstChild.textContent=$("nm").value||"مجهول";$("an").appendChild(document.createTextNode(" دعم البث بـ "+amt+"$"));
 $("am").textContent=$("ms").value;al.className="al cut";void al.offsetWidth;al.style.setProperty("--du",du+"s");al.className="al cut show";
 document.querySelectorAll(".chp").forEach(function(c){c.classList.toggle("on",+c.dataset.a===amt)})}
$("nm").addEventListener("input",play);$("ms").addEventListener("input",play);
setTimeout(play,300);

/* summary */
var all={};Object.keys(P).forEach(function(k){P[k].forEach(function(x){all[x[0]]=all[x[0]]||{};all[x[0]][k]=x[1]})});
var sumG=function(L){return L.reduce(function(s,x){return s+x[1]},0)},BT=sumG(P.best),best=P.best;
$("sum").innerHTML=[[BT,"إجمالي<br>الهدايا"],[Object.keys(all).length,"عدد<br>الداعمين"],[best[0][1],"أكبر عدد هدايا<br>لداعم"]].map(function(a){return '<div class="sm cut"><b data-n="'+a[0]+'">0</b><span>'+a[1]+'</span></div>'}).join("");

/* rosters */
function roster(k){
 var L=P[k],tot=sumG(L),mx=L[0][1];
 var feat=L.slice(0,3).map(function(x,i){
  var r=i+1,first=i===0;
  return '<button class="pc cut'+(first?" r1":" wide")+'" data-u="'+x[0]+'"><span class="gh">'+r+'</span>'+(first?'':'<span class="rb">#'+r+'</span>')+
   '<div class="tp">'+(first?CROWN+'<span class="kg">المتصدر</span>':'')+'<div class="dm">'+x[0][0].toUpperCase()+'</div><div class="nm">'+x[0]+'<small>'+Math.round(x[1]/tot*100)+'% من الهدايا</small></div></div>'+
   '<div class="ct"><b data-n="'+x[1]+'">0</b>هدية</div><div class="sb"><i data-w="'+(x[1]/mx*100)+'"></i></div></button>'}).join("");
 var list=L.slice(3).map(function(x,i){var r=i+4;
  return '<button class="lr" data-u="'+x[0]+'"><span class="rn">'+("0"+r).slice(-2)+'</span><div class="dm">'+x[0][0].toUpperCase()+'</div><div><div class="n2">'+x[0]+'</div><div class="sb"><i data-w="'+(x[1]/mx*100)+'"></i></div></div><div class="c2"><b data-n="'+x[1]+'">0</b><small>هدية</small></div></button>'}).join("");
 return '<section class="sec '+k+' rv" id="sec-'+k+'"><div class="rh"><span class="tt">'+META[k].t+'</span><h3>'+META[k].s+'</h3><span class="ln"></span><small>'+tot+' هدية · '+L.length+' داعمين</small></div><div class="ros">'+feat+'</div><div class="lst cut">'+list+'</div></section>'}
$("boards").innerHTML=roster("best")+'<div class="pair">'+roster("week")+roster("month")+'</div>';

/* interactions */
function hl(u,on){document.querySelectorAll("[data-u]").forEach(function(e){e.classList.toggle("hl",on&&e.dataset.u===u)})}
document.addEventListener("mouseover",function(e){var t=e.target.closest("[data-u]");if(t)hl(t.dataset.u,true)});
document.addEventListener("mouseout",function(e){var t=e.target.closest("[data-u]");if(t)hl(t.dataset.u,false)});
$("q").addEventListener("input",function(e){var q=e.target.value.trim().toLowerCase();document.querySelectorAll("[data-u]").forEach(function(el){el.classList.toggle("dim",!!q&&el.dataset.u.toLowerCase().indexOf(q)<0)})});
function who(u){var d=all[u],i=best.map(function(x){return x[0]}).indexOf(u)+1,g=d.best||0;
 var C={best:"var(--red)",month:"var(--month)",week:"var(--week)"};
 var rows=["best","month","week"].map(function(k){var ix=P[k].map(function(x){return x[0]}).indexOf(u),v=d[k]||0;return '<div><div class="l"><span>'+META[k].t+'</span><b>'+(v?v+' هدية · المركز '+(ix+1):"لا يوجد")+'</b></div><div class="sb"><i style="width:'+(v/P[k][0][1]*100)+'%;background:'+C[k]+'"></i></div></div>'}).join("");
 $("md").innerHTML='<button class="x" data-x aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="dm">'+u[0].toUpperCase()+'</div><div><h3>'+u+'</h3>'+(i?'<span class="bg">المركز '+i+' في الأساطير · '+Math.round(g/BT*100)+'%</span>':'')+'</div><div class="ml">'+rows+'</div><button class="btn" data-share>شارك الترتيب</button>';
 $("md").dataset.u=u;$("ov").classList.add("on");document.body.style.overflow="hidden"}
function closeM(){$("ov").classList.remove("on");document.body.style.overflow=""}
document.addEventListener("click",function(e){
 if(e.target===$("ov"))return closeM();
 var t=e.target.closest("[data-u],[data-x],[data-share],[data-b],[data-j],[data-l],[data-a],#sub,#b1,#b2");if(!t)return;
 if(t.dataset.a){amt=+t.dataset.a;return play()}
 if(t.dataset.l){e.preventDefault();return toast("سيتم فتح "+t.dataset.l)}
 if(t.dataset.j){var el=$("sec-"+t.dataset.j);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
 if(t.dataset.b)return badge(+t.dataset.b);
 if(t.hasAttribute("data-x"))return closeM();
 if(t.id==="sub"||t.id==="b1"||t.id==="b2"){e.preventDefault();return toast("سيتم فتح قناة كيك")}
 if(t.hasAttribute("data-share")){var u=$("md").dataset.u;try{navigator.clipboard.writeText(u+" من كبار داعمي ABS").then(function(){toast("تم النسخ")},function(){toast("تعذّر النسخ")})}catch(_){toast("تعذّر النسخ")}return}
 if(t.dataset.u)who(t.dataset.u)});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});

/* reveal + count-up */
function cu(el){var n=+el.dataset.n,t0=null;function s(t){t0=t0||t;var p=Math.min(1,(t-t0)/1400);el.textContent=fmt(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)}requestAnimationFrame(s)}
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var el=en.target;el.classList.add("in");el.querySelectorAll("[data-n]").forEach(cu);el.querySelectorAll("[data-w]").forEach(function(b){b.style.width=b.dataset.w+"%"});io.unobserve(el)})},{threshold:.12});
document.querySelectorAll(".rv").forEach(function(e){io.observe(e)});
